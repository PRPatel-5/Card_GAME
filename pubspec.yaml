name: memory_garden
description: A calm card game where every decision grows a living garden
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Game Engine
  flame: ^1.12.0
  flame_audio: ^2.1.0
  
  # Animations
  flutter_animate: ^4.5.0
  
  # UI
  google_fonts: ^6.1.0
  
  # Storage (Garden Memory)
  shared_preferences: ^2.2.2
  
  # Utils
  equatable: ^2.0.5
  
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/sounds/
